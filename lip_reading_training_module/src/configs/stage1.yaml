# Caile relative sunt raportate la directorul proiectului.
paths:
  db_root: /media/user/S4A/SOL10/DB_V2
  models_dir: Models
  manifest_dir: data/manifests
  output_dir: Models_Trained/romanizer
  initial_checkpoint: Models/romanizer/checkpoint_best.pt
  # Romanizer nou din AV-HuBERT preantrenat (director de rezultate fara checkpoint_last.pt):
  # initial_checkpoint: null
data:
  seed: 42
  shuffle: true
  splits:
    train: TRAIN
    validation: VALIDATION
common:
  seed: 1337
  log_interval: 200
  empty_cache_freq: 10000
distributed_training:
  device_id: 0
task:
  max_sample_size: 600
  pad_audio: false
  random_crop: true
  image_aug: true
model:
  dropout_input: 0.1
  dropout: 0.1
  attention_dropout: 0.1
  feature_grad_mult: 1.0
  activation_dropout: 0.0
dataset:
  num_workers: 4
  max_tokens: 1000
  required_batch_size_multiple: 8
optimization:
  # Bugetul schedulerului este calculat din epoci si minibatchurile reale.
  max_epoch: 50
  clip_norm: 10.0
  update_freq:
  - 8
  lr:
  - 0.0001
optimizer:
  adam_betas: (0.9,0.98)
  adam_eps: 1.0e-06
  weight_decay: 0.01
lr_scheduler:
  phase_ratio:
  - 0.05
  - 0.15
  - 0.80
  init_lr_scale: 0.01
  final_lr_scale: 0.01
checkpoint:
  save_interval_updates: 5000
  keep_interval_updates: 1
